name: Release

# Empacota a extensão e publica o .vsix em uma GitHub Release
# sempre que uma tag "v*" for enviada (ex.: v2.0.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build nucleo (gera os types consumidos pela extensão)
        run: npm run build:nucleo

      - name: Type-check
        run: npm run test

      - name: Package VSIX
        run: npm run package:vsix

      - name: Collect VSIX path
        id: vsix
        run: |
          file=$(ls packages/extensao-vscode/*.vsix | head -1)
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QAssistant ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.vsix.outputs.path }}
